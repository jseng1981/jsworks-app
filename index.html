<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J&amp;S Works</title>
<meta name="theme-color" content="#136f78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J&amp;S Works">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<style>
html,body{margin:0;height:100%;background:#f4f2ec;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#f4f2ec}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f4f2ec;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#1d2a2b;transition:opacity .3s}
#splash img{width:84px;height:84px;border-radius:20px}
#splash .bar{width:120px;height:4px;border-radius:2px;background:#e4e0d6;overflow:hidden}#splash .bar i{display:block;width:40%;height:100%;background:#136f78;animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#splash p{margin:0;font-size:13px;color:#5d6664;text-align:center;line-height:1.6;padding:0 24px}
#splash a{color:#136f78}
.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash" role="status"><img src="icons/icon-192.png" alt=""><b>J&amp;S Works</b><div class="bar"><i></i></div><p id="msg">불러오는 중…</p></div>
<iframe id="app" title="J&amp;S Works" allow="camera *; microphone *; clipboard-read *; clipboard-write *; screen-wake-lock *; fullscreen *; geolocation *; autoplay *"></iframe>
<script>
(function(){
  var u = window.JSW_APP_URL || '', f = document.getElementById('app'), s = document.getElementById('splash'), m = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec/.test(u)) { m.innerHTML = '앱 주소가 아직 설정되지 않았습니다.<br>관리자: config.js 에 웹 앱 주소(/exec)를 넣어 주세요.'; s.querySelector('.bar').style.display = 'none'; return; }
  var q = location.search.replace(/^\?/, '').split('&').filter(function(p){ return p && !/^src=/.test(p); }).join('&'), dst = u + (q ? '?' + q : '') + location.hash;
  if (window.JSW_MODE === 'open') { location.replace(dst); return; }
  // 구글 계정이 여러 개 로그인돼 있어도 열리도록: 시스템을 구글 로그인 정보 없이(시크릿 창처럼) 띄움 (크롬 · 엣지)
  if (window.JSW_CRED !== false) f.setAttribute('credentialless', '');
  // 시스템 로그인 토큰을 이 앱에 보관 (시크릿처럼 띄우면 시스템 쪽 저장소가 매번 비워지므로)
  window.addEventListener('message', function(e){
    if (!/^https:\/\/[\w.-]+\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {}; try {
      if (d.jsw === 'need-token') e.source.postMessage({jsw: 'token', t: localStorage.getItem('jsw_tok') || ''}, e.origin);
      else if (d.jsw === 'save-token') { if (d.t) localStorage.setItem('jsw_tok', d.t); else localStorage.removeItem('jsw_tok'); }
      else if (d.jsw === 'need-mic') { // 앱 안(iframe)에서 마이크가 막히면 앱 껍데기가 직접 권한을 물어봄
        var src = e.source, org = e.origin, rep = function(ok, err){ try { src.postMessage({jsw: 'mic', ok: ok, err: err || ''}, org); } catch (x) {} };
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) rep(false, 'nodev');
        else navigator.mediaDevices.getUserMedia({audio: true}).then(function(st){ st.getTracks().forEach(function(t){ t.stop(); }); rep(true); }, function(er){ rep(false, (er && er.name) || 'err'); });
      }
    } catch (x) {}
  });
  f.src = dst;
  var done = function(){ s.classList.add('hide'); setTimeout(function(){ s.style.display = 'none'; }, 400); };
  f.addEventListener('load', function(){ setTimeout(done, 600); });
  setTimeout(function(){ if (s.style.display !== 'none') m.innerHTML = '연결이 느립니다… 잠시만 기다려 주세요.<br><a href="' + u + '" target="_blank" rel="noopener">브라우저로 열기</a>'; }, 12000);
  if (!navigator.onLine) location.replace('offline.html');
  window.addEventListener('offline', function(){ m.textContent = '인터넷이 끊겼습니다.'; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + (window.JSW_SHELL || '1')).catch(function(){});
})();
</script>
</body>
</html>
